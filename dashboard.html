<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | AION Health</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
    <link rel="stylesheet" href="/src/dashboard.css">
</head>
<body data-theme="dark">
    <div id="dashboard-wrapper">
        <!-- Header -->
        <header class="dash-header">
            <div class="header-left">
                <a href="/index.html" class="dash-logo">AION <span>HEALTH</span></a>
                <div class="search-bar">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" placeholder="Search vital...">
                </div>
                <button class="btn-patient-manager">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path></svg>
                    Patient Manager
                </button>
            </div>
            <div class="header-right">
                <div class="search-condition">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" placeholder="Search Patients, Condition">
                </div>
                <div class="user-profile">
                    <div class="user-icons">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    </div>
                    <img src="https://i.pravatar.cc/150?u=jane" alt="User Avatar" class="avatar">
                </div>
            </div>
        </header>

        <main class="dash-content">
            <!-- Patient Banner -->
            <section class="patient-banner glass-panel">
                <div class="patient-info">
                    <img src="https://i.pravatar.cc/150?u=jane" alt="Jane Doe" class="patient-avatar">
                    <div class="patient-details">
                        <div class="name-status">
                            <h1>Jane Doe</h1>
                            <span class="status-badge good">Good</span>
                        </div>
                        <div class="meta-grid">
                            <div class="meta-item"><span>Age</span><strong>32 years</strong></div>
                            <div class="meta-item"><span>Sex</span><strong>Female</strong></div>
                            <div class="meta-item"><span>ID</span><strong>#871623</strong></div>
                            <div class="meta-item"><span>Last Sync</span><strong>25 Jan 2026 09:41</strong></div>
                        </div>
                    </div>
                </div>
                <div class="vitals-summary">
                    <!-- Circular Progress Charts -->
                    <div class="vital-circle">
                        <svg viewBox="0 0 36 36" class="circular-chart green">
                          <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                          <path class="circle" stroke-dasharray="100, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        </svg>
                        <div class="vital-value">
                            <strong>2192</strong>
                            <span>Steps</span>
                        </div>
                    </div>
                    <div class="vital-circle">
                        <svg viewBox="0 0 36 36" class="circular-chart blue">
                          <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                          <path class="circle" stroke-dasharray="75, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        </svg>
                        <div class="vital-value">
                            <strong>8</strong>
                            <span>Hours</span>
                        </div>
                    </div>
                    <div class="vital-circle">
                        <svg viewBox="0 0 36 36" class="circular-chart purple">
                          <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                          <path class="circle" stroke-dasharray="60, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        </svg>
                        <div class="vital-value">
                            <strong>5</strong>
                            <span>Liters</span>
                        </div>
                    </div>
                    <div class="legend">
                        <div class="leg-item"><span class="dot g"></span> 10%</div>
                        <div class="leg-item"><span class="dot b"></span> 75%</div>
                        <div class="leg-item"><span class="dot p"></span> 60%</div>
                    </div>
                </div>
            </section>

            <!-- Trends Grid -->
            <section class="trends-grid">
                <div class="trend-card glass-panel clickable-chart" data-chart-type="heart-rate">
                    <div class="trend-header">
                        <h3>Heart Rate</h3>
                        <span class="trend-period">12H</span>
                    </div>
                    <canvas id="mini-heart-rate-chart"></canvas>
                    <div class="trend-footer">
                        <div class="val">82 bpm</div>
                        <div class="change up">↑ 4% <span class="sub">last week</span></div>
                    </div>
                </div>
                <!-- More cards can be added here -->
                 <div class="trend-card glass-panel">
                    <div class="trend-header">
                        <h3>SpO2</h3>
                        <span class="trend-period">12H</span>
                    </div>
                    <canvas id="mini-spo2-chart"></canvas>
                    <div class="trend-footer">
                        <div class="val">98%</div>
                        <div class="change neutral">Steady</div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Graph Focus Modal -->
        <div id="graph-modal" class="modal-overlay hidden">
            <div class="modal-container glass-modal">
                <header class="modal-header">
                    <h2>Heart Rate</h2>
                    <div class="time-filters">
                        <button>12H</button>
                        <button>1D</button>
                        <button>3D</button>
                        <button class="active">This week</button>
                        <button>2W</button>
                        <button>3W</button>
                        <button>4W</button>
                        <button>6W</button>
                    </div>
                    <button class="modal-close" id="close-modal">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </header>
                <div class="modal-body">
                    <div class="chart-main">
                        <div class="chart-title">ECG (a.u.)</div>
                        <div class="canvas-wrap">
                            <canvas id="modal-main-chart"></canvas>
                        </div>
                        <div class="chart-scroller">
                            <canvas id="modal-scroll-chart"></canvas>
                            <div class="scroll-selection"></div>
                        </div>
                    </div>
                    <aside class="modal-info">
                        <div class="info-card green">
                            <div class="info-header">
                                <span>Heart rate</span>
                                <div class="info-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg></div>
                            </div>
                            <div class="info-value">82 <span>bpm</span></div>
                            <div class="info-avg">62-89 bpm avg.</div>
                        </div>
                        <div class="info-card teal">
                            <div class="info-header">
                                <span>HRV</span>
                                <div class="info-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path></svg></div>
                            </div>
                            <div class="info-value">34 <span>ms</span></div>
                            <div class="info-avg">32-55 ms avg.</div>
                        </div>
                    </aside>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/dashboard.js"></script>
</body>
</html>
